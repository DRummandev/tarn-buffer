name: replay

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scenario replay + selector/output tests
        run: |
          python -m unittest tests.test_selector tests.test_outputs -v 2>&1 | tee /tmp/replay.txt
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "# Scenario replay"
              echo
              echo '```'
              cat /tmp/replay.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
